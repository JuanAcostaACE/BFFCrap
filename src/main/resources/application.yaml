server:
  port: ${PORT:8080}

spring:
  # ──────────────────────────────────────────
  # Perfil por defecto: H2 en memoria (para desarrollo local sin DB real)
  # Para producción, las variables de entorno reemplazan estos valores.
  # ──────────────────────────────────────────
  datasource:
    url: ${DB_URL:jdbc:h2:mem:smartcane;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
  h2:
    console:
      enabled: true         # Acceder en: http://localhost:8080/h2-console
      path: /h2-console
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop  # En H2: crea tablas al iniciar, las borra al parar
    show-sql: true
    properties:
      hibernate:
        dialect: ${DB_DIALECT:org.hibernate.dialect.H2Dialect}
        format_sql: true

---
# ══════════════════════════════════════════
# PERFIL: prod (Railway + PostgreSQL)
# Activar con variable de entorno: SPRING_PROFILES_ACTIVE=prod
# ══════════════════════════════════════════
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  h2:
    console:
      enabled: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false